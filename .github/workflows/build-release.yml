name: Build and Release Rapid Download Manager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Production Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: |
          cargo build --release -p rapid-gui

      - name: Stage Distribution Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\RapidDownloadManager\extension" -Force
          New-Item -ItemType Directory -Path "dist\installer" -Force
          Copy-Item -Path "target\release\rapid-gui.exe" -Destination "dist\RapidDownloadManager\rapid-gui.exe" -Force
          Copy-Item -Path "extension\*" -Destination "dist\RapidDownloadManager\extension\" -Recurse -Force
          Copy-Item -Path "install_extension.bat" -Destination "dist\RapidDownloadManager\install_extension.bat" -Force
          Copy-Item -Path "run_rapid_gui.bat" -Destination "dist\RapidDownloadManager\run_rapid_gui.bat" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = ""
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) {
            $iscc = "ISCC.exe"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            throw "ISCC compiler not found"
          }
          & $iscc "installer\RapidDownloadManager.iss"
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "v1.0.1" }
          Compress-Archive -Path "dist\RapidDownloadManager\*" -DestinationPath "dist\installer\RapidDownloadManager_${tag}_Portable.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Rapid Download Manager ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/installer/RapidDownloadManager_Setup_*.exe
            dist/installer/RapidDownloadManager_*_Portable.zip
