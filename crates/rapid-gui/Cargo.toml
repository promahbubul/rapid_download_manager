[package]
name = "rapid-gui"
version = "0.1.0"
edition = "2021"
description = "Modern lightweight GUI for Rapid Download Manager"

[dependencies]
rapid-core = { path = "../rapid-core" }
tokio = { version = "1.38", features = ["full"] }
eframe = "0.28"
egui_extras = { version = "0.28", features = ["default"] }
rfd = "0.14"
anyhow = "1.0"
chrono = "0.4"
open = "5.3"
serde_json = "1.0"

