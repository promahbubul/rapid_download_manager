[package]
name = "rapid-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Modern lightweight GUI for Rapid Download Manager"

[dependencies]
log = "0.4"
rapid-core = { path = "../rapid-core" }
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
eframe = "0.28"
egui_extras = { version = "0.28", features = ["default"] }
rfd = "0.14"
anyhow = "1.0"
chrono = "0.4"
open = "5.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

urlencoding = "2"
reqwest = { version = "0.12", features = ["cookies"] }
arboard = "3"
rustybuzz = "0.20"
