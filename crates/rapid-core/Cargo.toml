[package]
name = "rapid-core"
version = "0.1.0"
edition = "2021"
description = "High-performance multi-segment download engine for Rapid Download Manager"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "cookies"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2.5"
bytes = "1.6"
chrono = { version = "0.4", features = ["serde"] }

urlencoding = "2"