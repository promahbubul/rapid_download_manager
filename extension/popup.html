<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B0E14;
      color: #F0F4F8;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #232A38;
      padding-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: #00D2FF;
    }
    .status-card {
      background: #151922;
      border: 1px solid #232A38;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-header {
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8A99AD;
      margin-right: 8px;
      transition: background 0.3s;
    }
    .status-dot.online {
      background: #2ECC71;
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.6);
    }
    .status-dot.offline {
      background: #E74C3C;
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
    }
    .info {
      font-size: 12px;
      color: #8A99AD;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      background: #232A38;
      color: #00D2FF;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <span class="title">Rapid Download Manager</span>
  </div>
  <div class="status-card">
    <div class="status-header">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking Connection...</span>
    </div>
    <div class="info" id="status-desc">
      Connecting to local Rapid Download Manager engine on port 9669...
    </div>
    <div class="badge" id="port-badge">Port: 127.0.0.1:9669</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
