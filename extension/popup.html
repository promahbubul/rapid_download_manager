<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B0E14;
      color: #F0F4F8;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #232A38;
      padding-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: #00D2FF;
    }
    .status-card {
      background: #151922;
      border: 1px solid #232A38;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ECC71;
      margin-right: 6px;
    }
    .info {
      font-size: 12px;
      color: #8A99AD;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 8px;
      background: #007ACC;
      color: #FFF;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #0098FF;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <span class="title">Rapid Download Manager</span>
  </div>
  <div class="status-card">
    <div style="font-size: 13px; font-weight: 600; margin-bottom: 4px;">
      <span class="status-dot"></span>Browser Integration Active
    </div>
    <div class="info">
      Downloads are automatically intercepted and routed to Rapid Download Manager for multi-threaded speed.
    </div>
  </div>
</body>
</html>
